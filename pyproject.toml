[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-graph-sampling"
version = "1.0.0"
description = "Research-grade graph sampling and Wilson-based GNN benchmarking toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI"}]
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "torch-geometric>=2.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.6.0",
]

[project.scripts]
gnn-train = "gnn_graph_sampling.experiments.train:main"
gnn-benchmark = "gnn_graph_sampling.experiments.benchmark:main"
gnn-diagnostics = "gnn_graph_sampling.experiments.diagnostics:main"
gnn-suite = "gnn_graph_sampling.experiments.suite:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]
