study_name: cora_budget_sweep_online
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs
  experiment_name: benchmark
  save_checkpoints: false
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  standardize_features: false
  split:
    mode: sampler
    val_ratio_of_remaining: 0.10
  datasets: [cora]
  feature_modes: [enabled]
model:
  family: graphsage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  input_dropout: 0.1
  aggr: mean
  use_batch_norm: false
  norm_type: layer
  residual: false
  jk_mode: last
  head_type: linear
  head_hidden_dim: 64
optimization:
  epochs: 160
  lr: 0.003
  weight_decay: 0.0005
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.0
  early_stopping_patience: 25
  min_epochs: 30
  scheduler_factor: 0.5
  scheduler_patience: 8
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1
sampling:
  samplers: [uniform, degree, wilson]
  modes: [online]
  online_schedules: [per_batch]
  budget_unit: ratio
  budget_values: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60]
  batch_sizes: [64]
  num_hops: [2]
  steps_per_epoch: 1
  eval_batch_size: 512
  sample_inference: false
  inference_max_batches: 32
  wilson:
    backend: auto
    q: 1.0
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
benchmark:
  runs: 2
  base_seed: 0
  parallel_workers: 1
evaluation:
  mode: full_graph
  device: auto
  batch_size: 2048
  non_blocking: true
  compute_train_metrics: true
  track_test_metrics_during_training: false
