study_name: amazon_computers_dataset_metrics
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true

output:
  root: outputs
  experiment_name: dataset_metrics/amazon_computers
  save_checkpoints: false
  overwrite: true
  append_timestamp: false
  timestamp_format: "%Y_%m_%d_%H_%M_%S"

logging:
  level: INFO
  log_to_stdout: true

data:
  root: data
  split_idx: 0
  standardize_features: false
  split:
    mode: sampler
    val_ratio_of_remaining: 0.10

  datasets: [amazon/computers]
  feature_modes: [enabled]

metrics:
  max_exact_path_nodes: 2000
  spectral_num_communities: null
  save_plots: true