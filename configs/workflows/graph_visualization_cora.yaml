study_name: graph_visualization_cora
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true

output:
  root: outputs
  experiment_name: graph_visualization
  save_checkpoints: false
  overwrite: true
  append_timestamp: false

logging:
  level: INFO
  log_to_stdout: true

data:
  root: data
  split_idx: 0
  standardize_features: false
  split:
    mode: predefined
    val_ratio_of_remaining: 0.10
  datasets: [cora]
  feature_modes: [enabled]

visualization:
  max_nodes: 500
  subgraph_method: random_nodes
  layout: spring
  color_by: label
  node_size_by: degree
  node_size: 22
  edge_alpha: 0.12
  node_alpha: 0.9
  output_format: png
  dpi: 180
