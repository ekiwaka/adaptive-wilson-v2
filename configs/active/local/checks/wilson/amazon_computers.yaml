study_name: wilson_checks_amazon_computers
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 2
  deterministic: true
output:
  root: outputs/active/local/checks
  experiment_name: wilson_checks_amazon_computers
  save_checkpoints: false
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  standardize_features: true
  datasets:
  - amazon/computers
  feature_modes:
  - enabled
  split:
    mode: public
sampling:
  samplers:
  - wilson
  modes:
  - static
  online_schedules:
  - per_batch
  budget_unit: ratio
  budget_values:
  - 0.1
  batch_sizes:
  - 64
  num_hops:
  - 2
  steps_per_epoch: 2
  eval_batch_size: 128
  wilson:
    backend: python
    q: 1.0
    allow_uniform_fill: false
    redraw_on_shortfall: false
    weight_estimation: monte_carlo_forests
    num_weight_forests: 64
    budget_targeting_enabled: false
  adaptive_wilson:
    q_i_mode: alpha
    alpha: 1.0
    alpha_grid:
    - 1.0
wilson_checks:
  q: 1.0
  sample_counts:
  - 10
  - 20
  - 50
  - 100
  num_forests: 20
  num_weight_forests: 20
  max_pairs: 16
  pair_count: 8
  max_exact_nodes: 6000
  make_undirected: true
  save_plots: true
