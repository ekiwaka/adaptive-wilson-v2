study_name: local_cpu_cora_sampler_search_gcn
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs
  experiment_name: search
  save_checkpoints: false
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  standardize_features: false
  datasets:
  - cora
  feature_modes:
  - enabled
  synthetic:
    sizes:
    - 400
    - 400
    - 400
    p_in: 0.1
    p_out: 0.01
    num_features: 32
    feature_noise: 0.4
    train_ratio: 0.6
    val_ratio: 0.2
model_search:
  hidden_dims:
  - 64
  - 128
  num_layers:
  - 2
  dropouts:
  - 0.45
  - 0.55
  aggrs:
  - mean
  jk_modes:
  - last
  head_hidden_dims:
  - 64
  use_batch_norm: false
  residual: false
  families:
  - gcn
optimization:
  epochs: 120
  lr: 0.003
  weight_decay: 0.0005
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.0
  early_stopping_patience: 20
  min_epochs: 30
  scheduler_factor: 0.5
  scheduler_patience: 8
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1
sampling:
  samplers:
  - uniform
  - degree
  - wilson
  batch_sizes:
  - 32
  - 64
  num_hops:
  - 2
  steps_per_epoch: 4
  eval_batch_size: 512
  sample_inference: false
  inference_max_batches: 32
  wilson_q_values:
  - 0.5
  - 1.0
  - 2.0
  wilson:
    backend: auto
    q: 1.0
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
search:
  runs: 1
  base_seed: 0
  parallel_workers: 1
  selection_metric: mean_val_macro_f1
evaluation:
  mode: full_graph
  device: auto
  batch_size: 2048
  non_blocking: true
  compute_train_metrics: true
  track_test_metrics_during_training: false
