study_name: local_cpu_citation_sampler_diagnostics
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs
  experiment_name: diagnostics
  save_checkpoints: false
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  standardize_features: false
  datasets: [cora, citeseer]
  feature_modes: [enabled]
  synthetic:
    sizes: [400, 400, 400]
    p_in: 0.10
    p_out: 0.01
    num_features: 32
    feature_noise: 0.4
    train_ratio: 0.6
    val_ratio: 0.2
model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  input_dropout: 0.0
  aggr: mean
  use_batch_norm: false
  norm_type: none
  residual: false
  jk_mode: last
  head_type: linear
  head_hidden_dim: 64
optimization:
  epochs: 1
  lr: 0.003
  weight_decay: 0.0005
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.0
  early_stopping_patience: 1
  min_epochs: 1
  scheduler_factor: 0.5
  scheduler_patience: 1
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1
sampling:
  samplers: [uniform, degree, wilson]
  batch_sizes: [8, 16, 32, 64, 128, 256]
  num_hops: [2]
  steps_per_epoch: 6
  eval_batch_size: 512
  sample_inference: false
  inference_max_batches: 32
  wilson:
    backend: auto
    q: 1.0
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
diagnostics:
  gradient_variance_batches: 6
