study_name: wikipedia_chameleon_static_multisplit_smoke
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true

output:
  root: outputs
  experiment_name: static_budget_multisplit_smoke
  save_checkpoints: false
  overwrite: true

logging:
  level: INFO
  log_to_stdout: true

data:
  root: data
  split_idx: 0
  split_indices:
  - 0
  planetoid_split: public
  standardize_features: true
  datasets:
  - wikipedia/chameleon
  feature_modes:
  - enabled

model:
  family: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5
  input_dropout: 0.1
  aggr: mean
  use_batch_norm: false
  norm_type: layer
  residual: true
  jk_mode: cat
  head_type: mlp
  head_hidden_dim: 128

optimization:
  epochs: 80
  lr: 0.0015
  weight_decay: 0.0007
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.02
  early_stopping_patience: 15
  min_epochs: 20
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 1.0e-05
  monitor_metric: accuracy

sampling:
  samplers:
  - none
  modes:
  - static
  online_schedules:
  - per_batch
  budget_unit: count
  budget_values:
  - 64
  - 128
  batch_sizes:
  - 64
  - 128
  num_hops:
  - 2
  steps_per_epoch: 1
  eval_batch_size: 1024
  sample_inference: false
  inference_max_batches: 16
  cache_preprocessed_graph: false
  reuse_cached_preprocessed_graph: false
  cache_dirname: preprocessed_graphs
  wilson:
    backend: auto
    q: null
    max_sampling_attempts: 4
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false

benchmark:
  runs: 1
  base_seed: 0
  parallel_workers: 1

evaluation:
  mode: full_graph
  device: auto
  batch_size: 1024
  non_blocking: true
  compute_train_metrics: true
  track_test_metrics_during_training: false