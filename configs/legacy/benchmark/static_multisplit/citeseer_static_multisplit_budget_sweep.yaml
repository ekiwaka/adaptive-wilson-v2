study_name: citeseer_static_multisplit_budget_sweep
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs
  experiment_name: static_budget_multisplit
  save_checkpoints: false
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  split_indices:
  - 0
  planetoid_split: public
  standardize_features: false
  datasets:
  - citeseer
  feature_modes:
  - enabled
model:
  family: gcn
  hidden_dim: 96
  num_layers: 2
  dropout: 0.6
  input_dropout: 0.15
  aggr: mean
  use_batch_norm: false
  norm_type: none
  residual: false
  jk_mode: last
  head_type: linear
  head_hidden_dim: 96
optimization:
  epochs: 260
  lr: 0.003
  weight_decay: 0.0009
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.0
  early_stopping_patience: 40
  min_epochs: 50
  scheduler_factor: 0.5
  scheduler_patience: 10
  scheduler_min_lr: 1.0e-05
  monitor_metric: accuracy
sampling:
  samplers:
  - uniform
  - degree
  - wilson
  - none
  modes:
  - static
  online_schedules:
  - per_batch
  budget_unit: count
  budget_values:
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
  - 80
  - 96
  - 112
  batch_sizes:
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
  - 80
  - 96
  - 112
  num_hops:
  - 2
  steps_per_epoch: 1
  eval_batch_size: 1024
  sample_inference: false
  inference_max_batches: 32
  cache_preprocessed_graph: true
  reuse_cached_preprocessed_graph: true
  cache_dirname: preprocessed_graphs
  wilson:
    backend: auto
    q: null
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
benchmark:
  runs: 5
  base_seed: 0
  parallel_workers: 4
evaluation:
  mode: full_graph
  device: auto
  batch_size: 1024
  non_blocking: true
  compute_train_metrics: true
  track_test_metrics_during_training: false
