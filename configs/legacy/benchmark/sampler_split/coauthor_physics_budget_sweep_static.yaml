study_name: coauthor_physics_budget_sweep_static
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true

output:
  root: outputs
  experiment_name: benchmark
  save_checkpoints: false
  overwrite: false
  append_timestamp: true
  timestamp_format: "%Y_%m_%d_%H_%M_%S"

logging:
  level: INFO
  log_to_stdout: true

data:
  root: data
  split_idx: 0
  standardize_features: true
  split:
    mode: sampler
    val_ratio_of_remaining: 0.10
  datasets: [coauthor/physics]
  feature_modes: [enabled]

model:
  family: gcn
  hidden_dim: 160
  num_layers: 2
  dropout: 0.30
  input_dropout: 0.05
  aggr: mean
  use_batch_norm: true
  norm_type: layer
  residual: false
  jk_mode: last
  head_type: linear
  head_hidden_dim: 128

optimization:
  epochs: 280
  lr: 0.002
  weight_decay: 0.0002
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: true
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.01
  early_stopping_patience: 45
  min_epochs: 60
  scheduler_factor: 0.5
  scheduler_patience: 14
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1

sampling:
  samplers: [uniform, degree, wilson]
  modes: [static]
  online_schedules: [per_batch]
  budget_unit: ratio
  budget_values: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  batch_sizes: [128]
  num_hops: [2]
  steps_per_epoch: 1
  eval_batch_size: 1024
  sample_inference: false
  inference_max_batches: 32
  wilson:
    backend: auto
    q: null
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false

benchmark:
  runs: 40
  base_seed: 0
  parallel_workers: 4

evaluation:
  mode: full_graph
  device: auto
  batch_size: 8192
  non_blocking: true
  compute_train_metrics: true
  track_test_metrics_during_training: false
