study_name: grid_benchmark_citeseer_on_q5p1
runtime:
  device: cuda
  device_policy: warn_and_fallback
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs/grid5000
  experiment_name: benchmark_qgrid_citeseer_on_q5p1
  save_checkpoints: true
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
data:
  root: data
  split_idx: 0
  standardize_features: true
  datasets:
  - citeseer
  feature_modes:
  - enabled
  synthetic:
    num_features: 32
    feature_noise: 0.4
    train_ratio: 0.6
    val_ratio: 0.2
model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  aggr: mean
  use_batch_norm: true
  residual: true
  jk_mode: last
  head_hidden_dim: 128
optimization:
  epochs: 100
  lr: 0.003
  weight_decay: 0.0001
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.05
  early_stopping_patience: 20
  min_epochs: 20
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1
evaluation:
  mode: exact_batched
  device: cuda
  batch_size: 512
  non_blocking: true
  compute_train_metrics: true
sampling:
  samplers:
  - uniform
  - degree
  - wilson
  batch_sizes:
  - 64
  - 128
  - 256
  num_hops:
  - 2
  steps_per_epoch: 24
  eval_batch_size: 256
  sample_inference: false
  inference_max_batches: 128
  wilson:
    backend: auto
    q: 5.1
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
benchmark:
  runs: 3
  base_seed: 0
  parallel_workers: 1
