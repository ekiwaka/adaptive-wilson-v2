study_name: questions_graph_visualization
runtime:
  device: cpu
  device_policy: warn_and_fallback
  seed: 0
  torch_num_threads: 1
  deterministic: true

output:
  root: outputs
  experiment_name: graph_visualization/questions
  save_checkpoints: false
  overwrite: true
  append_timestamp: false
  timestamp_format: "%Y_%m_%d_%H_%M_%S"

logging:
  level: INFO
  log_to_stdout: true

data:
  root: data
  split_idx: 0
  standardize_features: false
  split:
    mode: predefined
    val_ratio_of_remaining: 0.10
  datasets: [questions]
  feature_modes: [enabled]

visualization:
  max_nodes: 50000
  subgraph_method: full_graph
  layout: spring
  color_by: label
  node_size_by: constant
  node_size: 1.0
  edge_alpha: 0.05
  node_alpha: 0.85
  output_format: png
  dpi: 220