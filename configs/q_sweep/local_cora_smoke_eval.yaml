study_name: local_q_sweep_cora_smoke_eval
runtime:
  device: cpu
  device_policy: warn_and_fallback
  torch_num_threads: 1
  deterministic: true
output:
  root: outputs
  experiment_name: q_sweep
  save_checkpoints: true
  overwrite: true
logging:
  level: INFO
  log_to_stdout: true
dataset:
  name: cora
  root: data
  split_idx: 0
  feature_mode: enabled
  standardize_features: true
model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  aggr: mean
  use_batch_norm: true
  residual: true
  jk_mode: last
  head_hidden_dim: 128
optimization:
  epochs: 5
  lr: 0.003
  weight_decay: 0.0001
  use_amp: false
  grad_clip_norm: 1.0
  accumulation_steps: 1
  use_class_weights: false
  class_weight_mode: effective_num
  class_weight_beta: 0.999
  label_smoothing: 0.05
  early_stopping_patience: 3
  min_epochs: 1
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_lr: 1.0e-05
  monitor_metric: macro_f1
sampling:
  name: wilson
  batch_size: 32
  steps_per_epoch: 2
  eval_batch_size: 64
  num_hops: 2
  sample_inference: false
  inference_max_batches: 32
  wilson:
    backend: auto
    q: 1.0
    max_sampling_attempts: 8
    allow_uniform_fill: true
    make_undirected: false
    remove_self_loops: false
evaluation:
  mode: exact_batched
  device: cpu
  batch_size: 512
  non_blocking: false
  compute_train_metrics: true
q_sweep:
  q_values:
  - 0.1
  - 0.5
  runs: 1
  base_seed: 0
  parallel_workers: 1
  selection_metric: mean_val_macro_f1
